  <style>
    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; }

    body { background: #030D1E; scroll-snap-type: y mandatory; overflow-y: scroll; height: 100vh; }

    .slide { scroll-snap-align: start; scroll-snap-stop: always; height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2vh 2vw; }

    .slide img { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; box-shadow: 0 6px 30px rgba(0, 0, 0, 0.45); }

    .slide-number {
      position: fixed; bottom: 1rem; right: 1.5rem; font: 500 0.7rem ui-monospace, Menlo, monospace;
      color: #ABBCD5; background: rgba(3, 13, 30, 0.7); padding: 0.25rem 0.55rem; letter-spacing: 0.06em;
      pointer-events: none; user-select: none;
    }

    @media print {
      @page { size: landscape; margin: 0; }
      body { background: none; height: auto; overflow: visible; scroll-snap-type: none; }
      .slide { height: auto; padding: 0; page-break-after: always; }
      .slide img { box-shadow: none; }
      .slide-number { display: none; }
    }
  </style>
</head>

<div class="slide-number" id="slideNumber"></div>

<script>
  const slides = document.querySelectorAll('.slide');
  const numberEl = document.getElementById('slideNumber');

  function current() {
    return Math.round(window.scrollY / window.innerHeight);
  }

  function updateNumber() {
    numberEl.textContent = (current() + 1) + ' / ' + slides.length;
  }

  function goTo(index) {
    const target = Math.max(0, Math.min(slides.length - 1, index));
    window.scrollTo({ top: target * window.innerHeight, behavior: 'smooth' });
  }

  updateNumber();
  window.addEventListener('scroll', updateNumber, { passive: true });
  window.addEventListener('resize', updateNumber);

  document.addEventListener('keydown', (e) => {
    const advance = ['ArrowDown', 'ArrowRight', 'PageDown', ' '];
    const retreat = ['ArrowUp', 'ArrowLeft', 'PageUp'];

    if (advance.includes(e.key)) { e.preventDefault(); goTo(current() + 1); }
    else if (retreat.includes(e.key)) { e.preventDefault(); goTo(current() - 1); }
    else if (e.key === 'Home') { e.preventDefault(); goTo(0); }
    else if (e.key === 'End') { e.preventDefault(); goTo(slides.length - 1); }
    else if (e.key === 'f' || e.key === 'F') {
      if (!document.fullscreenElement) { document.documentElement.requestFullscreen?.(); }
      else { document.exitFullscreen?.(); }
    }
  });
</script>
